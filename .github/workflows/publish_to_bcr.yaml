# Publish new releases to Bazel Central Registry via OSS Exit Gate (D8: protobuf/bcr — b/576685645, b/576678670).
name: Publish to BCR
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string

permissions: read-all

jobs:
  publish_bcr_exit_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      WIF_PROVIDER: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      EXIT_GATE_BCR_REPO: 'protobuf--bcr'
      EXIT_GATE_BCR_MANIFEST_GCS: 'gs://oss-exit-gate-prod-projects-bucket/protobuf/bcr/manifests'
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name }}

      - name: Authenticate to Google Cloud (OSS Exit Gate WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Prepare and stage BCR module bundle to OSS Exit Gate (protobuf/bcr)
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG_NAME#v}"
          BCR_STAGE_DIR="$(mktemp -d)"
          cp MODULE.bazel "${BCR_STAGE_DIR}/MODULE.bazel"
          if [[ -f .bcr/presubmit.yml ]]; then
            cp .bcr/presubmit.yml "${BCR_STAGE_DIR}/presubmit.yml"
          fi
          if [[ -f .bcr/source.template.json ]]; then
            cp .bcr/source.template.json "${BCR_STAGE_DIR}/source.json"
          fi
          tar -czf "protobuf-bcr-${VERSION}.tar.gz" -C "${BCR_STAGE_DIR}" .

          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository="${EXIT_GATE_BCR_REPO}" \
            --package="protobuf" \
            --version="${VERSION}" \
            --source="protobuf-bcr-${VERSION}.tar.gz"

      - name: Trigger OSS Exit Gate BCR pipeline
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG_NAME#v}"
          cat << EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "protobuf",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "${EXIT_GATE_BCR_MANIFEST_GCS}/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
