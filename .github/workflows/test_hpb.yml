name: hpb tests

on:
  workflow_call:
    inputs:
      safe-checkout:
        required: true
        description: "The SHA key for the commit we want to run over"
        type: string

permissions:
  contents: read

jobs:
  # hpb tests are always run on presubmit
  linux:
    strategy:
      fail-fast: false   # Don't cancel all jobs if one fails.
      matrix:
        # Runs on both profiles of the composite Linux image (`latest`: Clang 23 /
        # Bazel 9.2.0, `floor`: Clang 14 / Bazel 8.7.0).
        profile: [latest, floor]
        config:
          - { name: Optimized, flags: --config=opt }

        include:
          - targets: "//hpb/... //hpb_generator/..."
          - bazel_cmd: "test"
          # Image per profile, pinned by digest. The digests are those of
          # composite:latest-v5 and composite:floor-v5, built from
          # protocolbuffers/build-support@383004c (test/linux/composite).
          - profile: latest
            image: "us-docker.pkg.dev/protobuf-build/containers/test/linux/composite@sha256:8c1582594164e79cdd713803f79352b12099ff16258de344440381e3f406758b"
          - profile: floor
            image: "us-docker.pkg.dev/protobuf-build/containers/test/linux/composite@sha256:a4a138ebf1221a641cbe7e0542a2169930f23ce3fca4ad741a17afadd4c3e889"

    name: Linux ${{ matrix.config.name }}${{ matrix.profile == 'floor' && ' (floor)' || '' }}
    runs-on: ubuntu-22-4core
    steps:
      - name: Checkout pending changes
        uses: protocolbuffers/protobuf-ci/checkout@v7
        with:
          ref: ${{ inputs.safe-checkout }}
      - name: Run tests
        uses: protocolbuffers/protobuf-ci/bazel-docker@v7
        with:
          image: ${{ matrix.image }}
          credentials: ${{ secrets.GAR_SERVICE_ACCOUNT }}
          bazel-cache: hpb_linux
          bash: >-
            bazel ${{ matrix.bazel_cmd }}
            ${{ matrix.targets }} ${{ matrix.config.flags }} $BAZEL_FLAGS
