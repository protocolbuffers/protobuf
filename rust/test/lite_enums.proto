// Enums from an `optimize_for = LITE_RUNTIME` file, which omit their value
// names.
syntax = "proto3";

package lite_enums;

option optimize_for = LITE_RUNTIME;

enum LiteTestEnum {
  LITE_TEST_ENUM_UNSPECIFIED = 0;
  LITE_TEST_ENUM_FOO = 1;
}
