edition = "2023";

package third_party_protobuf_rust_test;

import "rust/test/extensions.proto";

option java_multiple_files = true;

message SeparateFileSubmessage {
  extensions 1 to max;
}

message SeparateFileSubmessageMap {
  map<int32, SeparateFileSubmessage> submessages = 1;
}

extend TestExtensions {
  int32 i32_extension_separate_file = 1000;
  SeparateFileSubmessage submessage_extension_separate_file = 1002;
}
