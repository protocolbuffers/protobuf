edition = "2023";

package foo;

option java_package = "";
option java_outer_classname = "Test";

message Foo {
  enum Bar {
    FEE = 0;
  }
  Bar baz = 2 [features.field_presence = IMPLICIT];
}

message Bars {
  repeated Foo.Bar baz = 1;
}
