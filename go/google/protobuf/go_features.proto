syntax = "proto2";

package pb;

import "google/protobuf/descriptor.proto";

option go_package = "google.golang.org/protobuf/types/gofeaturespb";

extend google.protobuf.FeatureSet {
  // Go-specific Protobuf Editions features.
  // See https://protobuf.dev/editions/features/#lang-specific
  optional GoFeatures go = 1002;
}

// Go-specific features that configure Go code generation in Protobuf Editions.
// See https://protobuf.dev/editions/features/#lang-specific
message GoFeatures {
  // Whether or not to generate the deprecated UnmarshalJSON method for enums.
  // Can only be true for proto using the Open Struct api.
  optional bool legacy_unmarshal_json_enum = 1 [
    retention = RETENTION_RUNTIME,
    targets = TARGET_TYPE_ENUM,
    targets = TARGET_TYPE_FILE,
    feature_support = {
      edition_introduced: EDITION_2023,
      edition_deprecated: EDITION_2023,
      deprecation_warning: "The legacy UnmarshalJSON API is deprecated and "
                           "will be removed in a future edition.",
    },
    edition_defaults = { edition: EDITION_LEGACY, value: "true" },
    edition_defaults = { edition: EDITION_PROTO3, value: "false" }
  ];

  // Possible Go Protobuf generated API levels.
  // See https://protobuf.dev/editions/features/#go-api_level
  enum APILevel {
    // API_LEVEL_UNSPECIFIED results in selecting the OPEN API,
    // but needs to be a separate value to distinguish between
    // an explicitly set api level or a missing api level.
    API_LEVEL_UNSPECIFIED = 0;
    // Generates the Open Struct API, exposing struct fields for direct access.
    API_OPEN = 1;
    // Generates the Hybrid API, providing Opaque API accessor methods while
    // still exporting struct fields to assist with migration.
    API_HYBRID = 2;
    // Generates the Opaque API, hiding struct fields behind accessor methods
    // for getting, setting, and clearing fields.
    API_OPAQUE = 3;
  }

  // Selects which Go Protobuf API level (`API_OPEN`, `API_HYBRID`, or
  // `API_OPAQUE`) to generate for messages.
  // See https://protobuf.dev/editions/features/#go-api_level
  optional APILevel api_level = 2 [
    retention = RETENTION_RUNTIME,
    targets = TARGET_TYPE_MESSAGE,
    targets = TARGET_TYPE_FILE,
    feature_support = {
      edition_introduced: EDITION_2023,
    },
    edition_defaults = {
      edition: EDITION_LEGACY,
      value: "API_LEVEL_UNSPECIFIED"
    },
    edition_defaults = { edition: EDITION_2024, value: "API_OPAQUE" }
  ];

  // Possible prefix-stripping modes for generated Go enum value constants.
  // See https://protobuf.dev/editions/features/#go-strip_enum_prefix
  enum StripEnumPrefix {
    // Unknown or unspecified prefix-stripping mode; do not use explicitly.
    STRIP_ENUM_PREFIX_UNSPECIFIED = 0;
    // Keeps the proto enum value name as-is, even if prefixed with the enum
    // type name.
    STRIP_ENUM_PREFIX_KEEP = 1;
    // Generates both the full name and the prefix-stripped name as Go constants
    // to assist with migration.
    STRIP_ENUM_PREFIX_GENERATE_BOTH = 2;
    // Strips the enum type name prefix from generated Go enum value constants.
    STRIP_ENUM_PREFIX_STRIP = 3;
  }

  // Controls whether the Go code generator strips a redundant enum type name
  // prefix from generated Go enum value constants.
  // See https://protobuf.dev/editions/features/#go-strip_enum_prefix
  optional StripEnumPrefix strip_enum_prefix = 3 [
    retention = RETENTION_RUNTIME,
    targets = TARGET_TYPE_ENUM,
    targets = TARGET_TYPE_ENUM_ENTRY,
    targets = TARGET_TYPE_FILE,
    feature_support = {
      edition_introduced: EDITION_2024,
    },
    // TODO: change the default to STRIP_ENUM_PREFIX_STRIP for edition 2025.
    edition_defaults = {
      edition: EDITION_LEGACY,
      value: "STRIP_ENUM_PREFIX_KEEP"
    }
  ];

  // Wrap the OptimizeMode enum in a message for scoping:
  // This way, users can type shorter names (SPEED, CODE_SIZE).
  message OptimizeModeFeature {
    // The name of this enum matches OptimizeMode in descriptor.proto.
    enum OptimizeMode {
      // OPTIMIZE_MODE_UNSPECIFIED results in falling back to the default
      // (optimize for code size), but needs to be a separate value to distinguish
      // between an explicitly set optimize mode or a missing optimize mode.
      OPTIMIZE_MODE_UNSPECIFIED = 0;
      // Generates fast, specialized Go serialization and unmarshaling code.
      SPEED = 1;
      // Optimizes generated Go code for smaller binary code size.
      CODE_SIZE = 2;
      // There is no enum entry for LITE_RUNTIME (descriptor.proto),
      // because Go Protobuf does not have the concept of a lite runtime.
    }
  }

  // Controls whether Go code generation optimizes messages for execution speed
  // or code size.
  optional OptimizeModeFeature.OptimizeMode optimize_mode = 4 [
    retention = RETENTION_RUNTIME,
    targets = TARGET_TYPE_MESSAGE,
    targets = TARGET_TYPE_FILE,
    feature_support = {
      edition_introduced: EDITION_2024,
    },
    edition_defaults = {
      edition: EDITION_LEGACY,
      value: "OPTIMIZE_MODE_UNSPECIFIED"
    }
  ];
}
