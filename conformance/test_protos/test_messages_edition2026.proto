edition = "2026";

package protobuf_test_messages.editions;

import "google/protobuf/json_enumvalue_options.proto";

option java_package = "com.google.protobuf_test_messages.editions";
option objc_class_prefix = "Editions";

message TestAllTypesEdition2026 {
  int32 optional_int32 = 1;

  ForeignEnumEdition2026 optional_foreign_enum = 2;

  repeated ForeignEnumEdition2026 repeated_foreign_enum = 3;

  map<string, ForeignEnumEdition2026> map_string_foreign_enum = 4;

  map<int32, int32> map_int32_int32 = 5;
}

enum ForeignEnumEdition2026 {
  option allow_alias = true;

  FOREIGN_ENUM_EDITION2026_FOO = 0;

  // Values with a custom JSON name, for testing the (pb.enumvalue.json)
  // option in JSON serialization.
  FOREIGN_ENUM_EDITION2026_BAR = 1 [(pb.enumvalue.json).string = "customBar"];
  FOREIGN_ENUM_EDITION2026_BAZ = 2 [(pb.enumvalue.json).string = "customBaz"];
  FOREIGN_ENUM_EDITION2026_EMPTY = 3 [(pb.enumvalue.json).string = ""];
  FOREIGN_ENUM_EDITION2026_ESCAPES = 4
      [(pb.enumvalue.json).string = "e\"sc\tap\ne"];
  FOREIGN_ENUM_EDITION2026_ALIAS = 5
      [(pb.enumvalue.json).string = "customAlias"];
  FOREIGN_ENUM_EDITION2026_ALIAS_TOO = 5
      [(pb.enumvalue.json).string = "customAlias"];
  FOREIGN_ENUM_EDITION2026_NUMERIC = 6 [(pb.enumvalue.json).string = "6"];
}
