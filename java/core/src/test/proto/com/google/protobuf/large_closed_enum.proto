// Sample message to generate large closed enum code.

edition = "2024";

package protobuf_test_messages.edition.closedenum;

import option "google/protobuf/java_features.proto";

option java_package = "com.google.protobuf.large.closedenum.edition";
option features.enum_type = CLOSED;
option features.(pb.java).large_enum = true;

message LargeClosedEnumParent {
  LargeClosedEnum optional_value = 1;
  repeated LargeClosedEnum values = 2;
}

enum LargeClosedEnum {
  option allow_alias = true;

  LARGE_ENUM_UNSPECIFIED = 0;
  LARGE_ENUM1 = 1;
  LARGE_ENUM2 = 2;
  LARGE_ENUM2_ALIAS = 2;
}
