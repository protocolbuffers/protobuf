syntax = "proto3";

package test_descriptor_proto;

import "google/protobuf/descriptor.proto";

// Mirrors google.cloud.bigquery.storage.v1.ProtoSchema.
message TestProtoSchema {
  google.protobuf.DescriptorProto proto_descriptor = 1;
  google.protobuf.FileDescriptorProto file_descriptor = 2;
}
