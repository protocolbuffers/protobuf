edition = "2026";

package custom_enum_json;

import "google/protobuf/json_options.proto";

enum Armor {
  option allow_alias = true;

  ARMOR_UNKNOWN = 0;
  ARMOR_GREAT_HELM = 1 [(pb.enumvalue.json).string = "gr8 helm"];
  ARMOR_GORGET = 2;
  ARMOR_GAUNTLET = 3 [(pb.enumvalue.json).string = "a\"b"];
  ARMOR_PLATE = 4 [(pb.enumvalue.json).string = "\"plate\""];
  ARMOR_COIF = 5 [(pb.enumvalue.json).string = ""];
  ARMOR_PAULDRON = 6 [(pb.enumvalue.json).string = "p\taul\ndron"];
  ARMOR_SABATON = 7 [(pb.enumvalue.json).string = "sabaton"];
  ARMOR_SOLLERET = 7 [(pb.enumvalue.json).string = "sabaton"];
  ARMOR_HACHI_MAI_DO = 8 [(pb.enumvalue.json).string = "8"];
  ARMOR_VAMBRACE = 9 [(pb.enumvalue.json) = {}];
  ARMOR_GREAVES = 10 [(pb.enumvalue.json) = {}];
  ARMOR_CUIRASS = 11 [(pb.enumvalue.json) = {}];
  ARMOR_BREASTPLATE = 11;
  ARMOR_TASSET = 12;
  ARMOR_FAULD = 12 [(pb.enumvalue.json) = {}];
}

enum Weapon {
  WEAPON_UNKNOWN = 0 [(pb.enumvalue.json) = {}];
  WEAPON_SWORD = 1 [(pb.enumvalue.json) = {}];
  WEAPON_MACE = 2 [(pb.enumvalue.json) = {}];
}

enum EmptyOptionOrder {
  VAL_UNSPECIFIED = 0;
  VAL_EMPTY_OPT = 1 [(pb.enumvalue.json) = {}];
  VAL_EMPTY_STR = 2 [(pb.enumvalue.json).string = ""];
}

message Knight {
  Armor armor = 1;
  repeated Armor armors = 2;
  map<string, Armor> armor_map = 3;

  enum Shield {
    SHIELD_UNKNOWN = 0;
    SHIELD_BUCKLER = 1 [(pb.enumvalue.json).string = "buckler-custom"];
  }
  Shield shield = 4;
  Weapon weapon = 5;
  EmptyOptionOrder empty_option_order = 6;
  repeated Weapon weapons = 7;
}
