syntax = "proto2";

package closed_enum_required;

enum Proto2ClosedEnum {
  PROTO2_FIRST = 1;
  PROTO2_SECOND = 2;
}

message TestProto2ClosedEnumAndRequired {
  required string required_string = 1;
  required int32 required_int32 = 2;
  optional Proto2ClosedEnum optional_enum = 3;
  repeated Proto2ClosedEnum repeated_enum = 4;
  oneof enum_oneof {
    Proto2ClosedEnum oneof_enum = 5;
  }
}
