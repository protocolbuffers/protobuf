syntax = "proto2";

package presence_packing_proto2;

message TestProto2PresencePacking {
  optional int32 optional_int32 = 1;
  optional int64 optional_int64 = 2;
  optional bool optional_bool = 3;
  optional string optional_string = 4;
  optional int32 default_int32 = 5 [default = 42];
  optional string default_string = 6 [default = "custom"];

  repeated int32 repeated_default = 10;
  repeated int32 repeated_packed = 11 [packed = true];
  repeated int32 repeated_unpacked = 12 [packed = false];
  repeated int32 repeated_deprecated = 13 [deprecated = true];
}
